# Smithery Registry — hive-mcp-zk-attestation
# https://smithery.ai

startCommand:
  type: http
  configSchema:
    type: object
    properties: {}
    required: []
  url: https://hivemorph.onrender.com/mcp/hive-mcp-zk-attestation

name: hive-mcp-zk-attestation
displayName: hive-mcp-zk-attestation — verifiable agent state attestations (RFC-stage)
version: "0.1.0"
description: >
  RFC-stage MCP shim for verifiable agent state attestations. Groth16 and Plonk proofs of agent state hash + DID, anchored to Base. Aleo snarkVM-compatible verification keys are emittable. Attestation-only — no asset bridging, no custody, no wrapped value. Real Base USDC settlement at $0.05 per attestation. Backend endpoints publish when the v0.1 spec is finalized.

author:
  name: Steve Rotzin
  email: steve@thehiveryiq.com
  url: https://www.thehiveryiq.com

license: MIT
homepage: https://github.com/srotzin/hive-mcp-zk-attestation
repository:
  type: git
  url: https://github.com/srotzin/hive-mcp-zk-attestation

transport: streamable-http
endpoint: https://hivemorph.onrender.com/mcp
protocol: "2024-11-05"

categories:
  - agent-to-agent
  - cryptography
  - web3
  - identity

tags:
  - mcp
  - hive
  - zk
  - zero-knowledge
  - groth16
  - plonk
  - snarkvm
  - aleo-compatible
  - risc0-compatible
  - agent-attestation
  - autonomous-agent
  - base-l2
  - usdc

tools:
  - name: zk_attest_agent_state
    description: >
      Produce a Groth16 proof of an agent state hash + DID. Attestation-only — emits a proof, not a token; no value crosses chains. Cost $0.05 USDC on Base. Backend RFC-stage; returns backend_pending until rails land.
    inputs:
      - name: agent_did
        type: string
        required: true
        description: "DID of the agent whose state is being attested"
      - name: state_hash
        type: string
        required: true
        description: "Hex-encoded 32-byte hash of the agent state (poseidon or sha256)"
      - name: circuit
        type: string
        required: false
        description: "Circuit identifier; defaults to groth16-bn254-agent-state-v1"
      - name: public_inputs
        type: array
        required: false
        description: "Optional public inputs as hex strings"
  - name: zk_verify_proof
    description: >
      Verify a submitted proof against a known verification key. Returns boolean validity plus the verification key fingerprint. Free. Read-only — no settlement, no on-chain write.
    inputs:
      - name: proof
        type: string
        required: true
        description: "Hex-encoded proof bytes (Groth16 or Plonk)"
      - name: verification_key_id
        type: string
        required: true
        description: "Identifier of the verification key to check against"
      - name: public_inputs
        type: array
        required: false
        description: "Public inputs the proof was generated against"
  - name: zk_anchor_to_base
    description: >
      Write a proof commitment (32-byte hash) to Base via the Hive gateway. Anchors the attestation; does not bridge value or custody assets. Cost $0.02 USDC + L1 gas. Backend RFC-stage; returns backend_pending until rails land.
    inputs:
      - name: proof_commitment
        type: string
        required: true
        description: "Hex-encoded 32-byte commitment to the proof"
      - name: agent_did
        type: string
        required: true
        description: "DID of the attesting agent"
      - name: verification_key_id
        type: string
        required: false
        description: "Identifier of the verification key referenced by the proof"
  - name: zk_list_circuits
    description: >
      Enumerate supported circuits and their verification key fingerprints. Includes Groth16, Plonk, and Aleo snarkVM-compatible templates. Free. Read-only.
    inputs: []
  - name: zk_query_attestation
    description: >
      Fetch a previously-anchored attestation by Base transaction hash. Returns the proof commitment, verification key id, agent DID, and block number. Free. Read-only.
    inputs:
      - name: tx_hash
        type: string
        required: true
        description: "Base L2 transaction hash of the anchored attestation"

runtime:
  type: node
  version: ">=18"
  command: node server.js
  env:
    - name: PORT
      default: "3000"
      required: false
    - name: HIVE_BASE
      default: "https://hivemorph.onrender.com"
      required: false
